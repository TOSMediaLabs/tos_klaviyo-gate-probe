# Wächter für geschützte Dateien (Pflicht-Check "Protected Files Guard").
# Vergleicht die geschützten Dateien des geprüften Stands mit der Prüfliste unten.
# Entscheidend ist nur der Inhalt, nicht wer den Pull Request geöffnet oder zuletzt gepusht hat.
# Legitime Änderung: im selben Pull Request die Prüfliste anpassen; das setzt Schreibrecht auf
# Workflow-Dateien voraus und braucht die Freigabe durch das Freigabe-Team.
# Diese Datei selbst steht mit dem Hash ihres Inhalts ohne die Prüfliste in der Prüfliste. Das
# erkennt versehentliche Änderungen; wer diese Datei ändern kann, kann auch die Prüfung ändern.
name: Protected Files

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Protected Files Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare protected files
        env:
          # Format: <Modus> <SHA-256 des Inhalts> <Pfad>; für diese Datei: Inhalt ohne Prüfliste
          MANIFEST: |
            100644 0e02c0d0cfd03bba0574e2971265f291f7d7b7eb199ee4511427603796979713 .github/CODEOWNERS
            100644 47319e823a85c80d5384da6a21bc6d87a2d8dbec3fadfae352916a436c5c1836 AGENTS.md
            100644 452a1dfb8e0c2f5dd877a277d20541afc9a442ae442e2b167a315b2980a1c61e .github/workflows/php-checks.yml
            100644 4ac92227bdcdbd2c6cd1c4fb59eddb5088588c4b2102eb53d749fd75369b1fca phpstan.neon
            100644 5433a1c3aa0e4bb2d4219911d2b60f5bed63329171aafd430de0639f8f7f071b composer.json
            100644 d33944a1bb9a5186704dab7b14c5f3e4751ca296234d266e7e7bbf96d9491a1d composer.lock
            100644 fc74f5cd18ab8c1fade91f79f63fd398517a0cb89c8d7277dd4aedc66a75d06e .github/workflows/protected-files.yml
        run: |
          set -euo pipefail
          self='.github/workflows/protected-files.yml'

          is_protected() {
            local path="$1" lower base
            lower="${path,,}"
            base="${lower##*/}"
            case "$path" in
              .github/*|vendor/*) return 0 ;;
              CODEOWNERS|docs/CODEOWNERS) return 0 ;;
              composer.json|composer.lock) return 0 ;;
              phpstan.neon|phpstan.neon.dist|phpstan.dist.neon) return 0 ;;
            esac
            case "$lower" in
              .codex/*|*/.codex/*|.claude/*|*/.claude/*) return 0 ;;
            esac
            case "$base" in
              agents.md|agents.override.md|claude.md|claude.local.md) return 0 ;;
            esac
            return 1
          }

          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' "$MANIFEST" | sed '/^[[:space:]]*$/d' | LC_ALL=C sort > "$expected"
          if [ ! -s "$expected" ]; then
            echo "::error title=Protected Files Guard::Prüfliste ist leer."
            exit 1
          fi

          tree="$(mktemp)"
          found="$(mktemp)"
          git ls-tree -r -z --full-tree HEAD > "$tree"
          while IFS= read -r -d '' entry; do
            meta="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            if [[ "$path" == *[[:cntrl:]]* ]]; then
              echo "::error title=Protected Files Guard::Pfad mit Steuerzeichen im Stand."
              exit 1
            fi
            is_protected "$path" || continue
            read -r mode type oid <<< "$meta"
            if [ "$type" = blob ] && [ "$path" = "$self" ]; then
              hash="$(git cat-file blob "$oid"                 | sed '/^          MANIFEST: |$/,/^        run: |$/{/^        run: |$/!d;}'                 | sha256sum | cut -d ' ' -f 1)"
            elif [ "$type" = blob ]; then
              hash="$(git cat-file blob "$oid" | sha256sum | cut -d ' ' -f 1)"
            else
              hash="$type-$oid"
            fi
            printf '%s %s %s\n' "$mode" "$hash" "$path" >> "$found"
          done < "$tree"
          LC_ALL=C sort "$found" > "$actual"

          echo "Geprüfter Stand: $(git rev-parse HEAD) (Ereignis $GITHUB_EVENT_NAME)"
          echo "Geschützte Dateien im Stand:"
          cat "$actual"

          if ! diff -u "$expected" "$actual"; then
            echo "::error title=Protected Files Guard::Geschützte Dateien weichen von der Prüfliste ab."
            exit 1
          fi
          echo "Geschützte Dateien unverändert."
