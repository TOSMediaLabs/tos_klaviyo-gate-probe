# Pflicht-Checks für das Probe-Repository.
# Die Jobnamen sind die Check-Namen, die das Ruleset als Pflicht verlangt; nicht umbenennen.
# Nur GitHub-gehostete Runner, keine Secrets, Token nur lesend.
name: PHP Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  phpstan:
    name: PHPStan Level 8
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer:2.10.3
          coverage: none
        env:
          fail-fast: true

      - name: Validate composer.json and composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  php-syntax:
    name: PHP Syntax Check (N1-Test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
        env:
          fail-fast: true

      - name: Check syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -r -n 1 php -l
